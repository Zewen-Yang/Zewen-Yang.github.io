    Experience:
      - company: Agile Robots SE
        position: Senior Research Scientist
        location: Munich, Germany
        url: https://www.agile-robots.com/en/
        start_date: 2026-01-01
        end_date: present
        highlights:
          - "Own end-to-end development of expert VLA policies for an industrial dust-cup removal task on semi-humanoid robots with multi-camera perception, from data collection through on-robot deployment"
          - "Built the post-processing and cleaning pipeline that turns several thousand real-robot demonstrations into training and benchmark datasets, with training on a GPU cluster and experiment tracking in Weights & Biases"
          - "Train, benchmark, and deploy in-house and state-of-the-art VLA policies on robot hardware; the final policy reached 99% task success over 100 real-robot trials"
          - "Led a 4-person cross-functional team to deliver a humanoid interaction system shown live at NVIDIA GTC 2026, owning the overall pipeline and motion planning with VLM agents decomposing high-level goals"
          - "Defined the research roadmap on distributed flow-matching policies for robot motion generation and mentor 2 student researchers on an agentic framework for long-horizon manipulation tasks"

      - company: Munich Institute of Robotics and Machine Intelligence (MIRMI), TUM
        position: Postdoctoral Researcher
        location: Munich, Germany
