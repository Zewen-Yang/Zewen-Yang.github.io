name: Update GitHub Repository Cards

on:
  schedule:
    - cron: "0 3 * * 1" # Monday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-repo-cards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Refresh repository metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python bin/update_repo_cards.py

      - name: Configure Git
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

      - name: Commit and push if changed
        run: |
          git add _data/repo_cards.yml
          git diff --staged --quiet || (
            echo "📤 Committing refreshed repository cards..."
            git commit -m "Update GitHub repository cards"
            git push
          )
