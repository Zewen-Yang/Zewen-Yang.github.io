name: Update Google Scholar Citations

on:
  schedule:
    - cron: "0 0 * * 1" # Monday
    - cron: "0 0 * * 3" # Wednesday
    - cron: "0 0 * * 5" # Friday
  workflow_dispatch:

jobs:
  update-citations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # See docs/CUSTOMIZE.md for details on how to set up PAT for triggering subsequent workflows
      #        with:
      #          token: ${{ secrets.PAT }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          echo "🔧 Installing dependencies..."
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Save current citations.yml hash
        id: before
        run: |
          echo "📦 Checking existing citations.yml hash..."
          if [ -f _data/citations.yml ]; then
            sha_before=$(sha256sum _data/citations.yml | awk '{print $1}')
            echo "sha_before=$sha_before" >> $GITHUB_OUTPUT
            echo "📝 SHA before: $sha_before"
          else
            echo "sha_before=none" >> $GITHUB_OUTPUT
            echo "📝 No existing citations.yml file found."
          fi

      - name: Run citation update script
        id: run_citation_update
        shell: bash
        # Google Scholar returns 403 to GitHub-hosted runner IPs, and scholarly then
        # retries forever, so a direct fetch from CI cannot succeed. Add a repository
        # secret named SCRAPERAPI_KEY (https://www.scraperapi.com/) to route the
        # requests through a reliable proxy; bin/update_scholar_citations.py picks it
        # up. Without the secret the script falls back to free public proxies, which
        # work some of the time.
        env:
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: |
          set +e
          if [ -n "$SCRAPERAPI_KEY" ]; then
            # Proxied requests are slow (ScraperAPI uses 60s timeouts per request).
            run_timeout=600
            echo "🔐 SCRAPERAPI_KEY is configured; using ScraperAPI proxy (timeout ${run_timeout}s)."
          else
            # Best effort: rotate through free public proxies. A direct fetch would
            # only spin on 403 retries until killed.
            export SCHOLARLY_FREE_PROXIES=1
            run_timeout=300
            echo "⚠️ No SCRAPERAPI_KEY secret; trying free public proxies (timeout ${run_timeout}s)."
          fi
          echo "🚀 Running citation update script (single attempt)..."
          start_time=$(date)
          timeout "$run_timeout" python bin/update_scholar_citations.py
          status=$?
          end_time=$(date)
          set -e
          if [ $status -eq 0 ]; then
            echo "✅ Citation update succeeded (started at $start_time, ended at $end_time)."
            echo "✅ Citation update succeeded." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          echo "❌ Citation update script failed with exit code $status (started at $start_time, ended at $end_time)."
          {
            echo "❌ Citation update script failed with exit code $status."
            if [ $status -eq 124 ]; then
              echo "(124 = killed by \`timeout ${run_timeout}\`; see the step log above for scholarly's last 403/captcha messages.)"
            fi
            echo ""
            echo "\`_data/citations.yml\` is now stale — the publication badges keep showing the last committed counts."
            if [ -z "$SCRAPERAPI_KEY" ]; then
              echo ""
              echo "Google Scholar blocks GitHub Actions runner IPs; this run used best-effort free proxies and they did not get through."
              echo "For a reliable run add a \`SCRAPERAPI_KEY\` repository secret (Settings → Secrets and variables → Actions),"
              echo "or refresh locally with \`python bin/update_scholar_citations.py\` and commit the result."
            fi
          } >> $GITHUB_STEP_SUMMARY
          exit $status

      - name: Save new citations.yml hash
        id: after
        run: |
          echo "🔍 Checking updated citations.yml hash..."
          if [ -f _data/citations.yml ]; then
            sha_after=$(sha256sum _data/citations.yml | awk '{print $1}')
            echo "sha_after=$sha_after" >> $GITHUB_OUTPUT
            echo "📝 SHA after: $sha_after"
          else
            echo "sha_after=none" >> $GITHUB_OUTPUT
            echo "📝 citations.yml was not created or is missing."
          fi

      - name: Report citations.yml change in summary
        run: |
          echo "📋 Comparing citation file hashes..."
          if [ "${{ steps.before.outputs.sha_before }}" != "${{ steps.after.outputs.sha_after }}" ]; then
            echo "✅ _data/citations.yml was updated."
            echo "✅ _data/citations.yml was updated." >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ _data/citations.yml was not changed."
            echo "ℹ️ _data/citations.yml was not changed." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Configure Git
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          echo "🔧 Git configured."

      - name: Commit and push if changed
        run: |
          git add _data/citations.yml
          git diff --staged --quiet || (
            echo "📤 Committing and pushing changes..."
            git commit -m "Update Google Scholar citations"
            git push
          )
